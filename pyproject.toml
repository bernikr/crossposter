[project]
name = "crossposter"
version = "1.2.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.15.*"
dependencies = ["atproto>=0.0.73", "mastodon-py>=2.3.3"]

[dependency-groups]
dev = [
  "gitpython>=3.2.1",
  "mypy>=2.4.0",
  "prek>=0.5.7",
  "pytest>=9.2.0",
  "ruff>=0.17.3",
  "semver>=3.1.0",
]

[tool.uv]
package = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = [
  "D",   # pydocstyle
  "CPY", # flake8-copyright
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "assert",                      # assert is the pytest idiom
  "hardcoded-password-func-arg", # fake credentials in tests
  "magic-value-comparison",
]


[tool.mypy]
strict = true
